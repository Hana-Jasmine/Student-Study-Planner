<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner | Hana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Planner 🌿</h1>
        <p>Plan your day. Track your progress. Achieve your goals.</p>
        
    </header>

    <main>

        <section class="welcome">
            <h2>Hello, Student! 👋</h2>
            <p>Let's make today productive.</p>
        </section>

        <!-- Dashboard Statistics -->

<section class="dashboard">
    <div class="stat-card">
        <h3>📅 Today's Date</h3>
        <p id="today-date">Loading...</p>
    </div>

    <div class="stat-card">
        <h3>📝 Total Tasks</h3>
        <p id="total-tasks">0</p>
    </div>

    <div class="stat-card">
        <h3>✅ Completed</h3>
        <p id="completed-tasks">0</p>
    </div>
</section>

        <section class="progress-card">
            <h2>Today's Progress</h2>
            <p id="progress-text">0% Completed</p>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </section>

        <section class="task-section">

            <h2>My Study Tasks</h2>

            <div class="task-form">

                <input type="text" id="task-input"
                    placeholder="Enter your study task">

                <select id="subject-input">
                    <option value="">Select Subject</option>
                    <option>Python</option>
                    <option>DBMS</option>
                    <option>Operating Systems</option>
                    <option>Data Structures</option>
                    <option>Software Engineering</option>
                    <option>Other</option>
                </select>

<!-- Priority Dropdown -->
<select id="priority-input">
    <option value="">Select Priority</option>
    <option value="High">🔴 High</option>
    <option value="Medium">🟡 Medium</option>
    <option value="Low">🟢 Low</option>
</select>

                <input type="date" id="date-input">

                <button id="add-task">+ Add Task</button>

            </div>
<div class="task-tools">
    <input type="text" id="search-input"
        placeholder="🔍 Search tasks...">

    <select id="filter-input">
        <option value="All">All Tasks</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="High">High Priority</option>
        <option value="Medium">Medium Priority</option>
        <option value="Low">Low Priority</option>
    </select>

    <button id="clear-all">Clear All Tasks</button>
</div>
            <div id="task-list"></div>

        </section>

    </main>

    <footer>
        <p>Designed with 💚 by Hana Jasmine</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
